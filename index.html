<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Balap Karung 3D</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.css">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:'Baloo 2',system-ui,sans-serif;background:#8fd3ff;color:#16322a;user-select:none;touch-action:manipulation}
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:1}
.scr{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;z-index:5;background:linear-gradient(#8fd3ffdd,#bfe9a8dd);text-align:center}
.scr.on{display:flex}
h1{font-size:clamp(36px,10vw,68px);font-weight:800;color:#ff7a1a;text-shadow:0 4px 0 #8a3b00;line-height:1}
h2{font-size:26px}
.btn{border:0;border-radius:16px;padding:10px 22px;font:700 20px 'Baloo 2';background:#ff7a1a;color:#fff;box-shadow:0 5px 0 #a84a00;cursor:pointer;min-width:230px}
.btn.alt{background:#1f8a5a;box-shadow:0 5px 0 #0f5535}.btn.sm{min-width:0;font-size:15px;padding:6px 14px}
.btn:active{transform:translateY(3px)}
input,select{font:600 18px 'Baloo 2';padding:8px 14px;border-radius:12px;border:3px solid #1f5a3a;min-width:230px;text-align:center;background:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.gb{font-size:50px;background:#fff;border-radius:18px;padding:6px 18px;opacity:.55;cursor:pointer;border:4px solid transparent}
.gb.sel{opacity:1;border-color:#ff7a1a}
.card{background:#fffdf4;border-radius:20px;padding:18px;box-shadow:0 8px 0 #0002;display:flex;flex-direction:column;gap:10px;align-items:center;max-width:94vw}
#hud{position:fixed;inset:0;pointer-events:none;display:none;z-index:3}
#hud>*{pointer-events:auto}
#top{position:absolute;top:8px;left:8px;right:8px;pointer-events:none}
#rank{font-weight:800;font-size:22px;color:#fff;text-shadow:0 2px 0 #0007}
#prog{position:relative;height:14px;background:#0004;border-radius:8px;margin-top:4px}
#prog i{position:absolute;top:-3px;width:20px;height:20px;border-radius:50%;border:3px solid #fff;margin-left:-10px;transition:left .15s}
#sp{position:absolute;left:10px;bottom:146px;width:min(300px,64vw);pointer-events:none}#spt{color:#fff;font-weight:800;font-size:15px;text-shadow:0 2px 0 #0007}#spb{height:14px;background:#0005;border-radius:9px;overflow:hidden;position:relative;border:3px solid #fff}#spb b{display:block;height:100%;width:0;background:#3ddc5a;transition:width .1s}#spb u{position:absolute;top:0;bottom:0;width:2px;background:#fff}
#en{position:absolute;left:10px;bottom:96px;width:min(260px,60vw);pointer-events:none}
#enb{height:22px;background:#0005;border-radius:12px;overflow:hidden;position:relative;border:3px solid #fff}
#enb b{display:block;height:100%;width:100%;background:#3ddc5a;transition:width .1s}
#enb u{position:absolute;top:0;bottom:0;width:2px;background:#fff}
#ent{color:#fff;font-weight:800;text-shadow:0 2px 0 #0007}
#cb{position:absolute;right:8px;top:54px}
#tap{position:absolute;right:14px;bottom:18px;width:min(46vw,200px);height:76px;border:0;border-radius:40px;background:#ff7a1a;color:#fff;font:800 28px 'Baloo 2';box-shadow:0 7px 0 #a84a00}
#tap:active{transform:translateY(5px);box-shadow:0 2px 0 #a84a00}
#qp{position:fixed;left:50%;bottom:14px;transform:translate(-50%,130%);width:min(560px,96vw);background:#fffdf4;border-radius:22px;padding:14px;z-index:8;transition:transform .25s;display:flex;flex-direction:column;gap:8px;box-shadow:0 0 0 4px #ff7a1a}
#qp.on{transform:translate(-50%,0)}
.qt{font-weight:700;font-size:19px}
#qp{max-height:80vh;max-height:80dvh;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y}
#qp .qt,#qp button{max-width:100%;overflow-x:auto;overflow-y:hidden}
#qp .katex-display{max-width:100%}
#qp button{font:600 17px 'Baloo 2';text-align:left;padding:8px 12px;border-radius:12px;border:3px solid #1f5a3a;background:#fff;cursor:pointer}
#qp.wait button{opacity:.45;cursor:default}.cd{font-weight:800;color:#ff7a1a;font-size:18px}
#qp button.ok{background:#3ddc5a}#qp button.no{background:#ff5a5a;color:#fff}
#big{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:min(34vw,220px);font-weight:800;color:#fff;text-shadow:0 8px 0 #ff7a1a,0 0 30px #0006;z-index:6;pointer-events:none}
#big.pop{animation:pop .8s ease-out}
@keyframes pop{0%{transform:scale(2.4);opacity:0}30%{opacity:1}100%{transform:scale(1)}}
#card{position:fixed;left:50%;bottom:14%;transform:translateX(-50%);background:#ff7a1a;color:#fff;font-weight:800;font-size:clamp(24px,7vw,46px);padding:6px 28px;border-radius:20px;border:5px solid #fff;z-index:6;display:none;white-space:nowrap}
#cm{position:fixed;top:56px;left:50%;transform:translateX(-50%);max-width:min(480px,70vw);background:#fffdf4;border:4px solid #ff7a1a;border-radius:16px;padding:4px 12px;font-weight:700;font-size:15px;z-index:7;display:none;pointer-events:none;text-align:center}
#feed{position:fixed;top:84px;left:8px;z-index:7;display:flex;flex-direction:column;gap:5px;pointer-events:none}
.nt{color:#fff;font-weight:800;font-size:16px;padding:4px 12px;border-radius:12px;border:3px solid #fff;animation:ni .25s ease-out}
.nt.y{background:#1f9a4a}.nt.n{background:#d63a3a}
@keyframes ni{from{transform:translateX(-120%)}}
#toast{position:fixed;top:30%;left:50%;transform:translateX(-50%);font-weight:800;font-size:34px;color:#fff;text-shadow:0 3px 0 #0008;z-index:7;pointer-events:none;opacity:0}
#toast.s{animation:tt 1.1s ease-out}
@keyframes tt{0%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-60px)}}
ol{text-align:left;font-size:20px;font-weight:600;padding-left:30px}
#cele{position:fixed;inset:0;z-index:6;pointer-events:none;display:none;overflow:hidden}
#cele.on{display:block}
#cele .bn{position:absolute;left:50%;top:22%;transform:translateX(-50%);text-align:center;font-weight:800;color:#fff;font-size:clamp(34px,11vw,84px);line-height:1;text-shadow:0 5px 0 #ff7a1a,0 0 26px #0008;animation:cb 1.1s cubic-bezier(.2,1.6,.4,1) both,cw 1.6s ease-in-out 1.1s infinite;white-space:nowrap}
#cele .bn small{display:block;font-size:.42em;margin-top:6px;text-shadow:0 3px 0 #0008}
@keyframes cb{0%{transform:translateX(-50%) scale(0) rotate(-12deg);opacity:0}100%{transform:translateX(-50%) scale(1) rotate(0);opacity:1}}
@keyframes cw{0%,100%{transform:translateX(-50%) scale(1) rotate(-2deg)}50%{transform:translateX(-50%) scale(1.08) rotate(2deg)}}
#cele .em{position:absolute;top:-60px;animation:cf linear forwards}
@keyframes cf{to{transform:translateY(112vh) rotate(540deg)}}
#cele .ring{position:absolute;left:50%;top:32%;width:40px;height:40px;margin:-20px;border-radius:50%;border:6px solid #ffd23a;animation:rg 1.4s ease-out both}
@keyframes rg{from{transform:scale(.2);opacity:1}to{transform:scale(14);opacity:0}}
#toast.c{font-size:30px}
